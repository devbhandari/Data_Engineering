# The main pipeline for pyspark_with_Databricks

resources:
  pipelines:
    pyspark_with_Databricks_etl:
      name: pyspark_with_Databricks_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/pyspark_with_Databricks_etl"

      libraries:
        - glob:
            include: ../src/pyspark_with_Databricks_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
